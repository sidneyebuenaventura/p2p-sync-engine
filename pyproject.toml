[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "p2p-sync-engine"
version = "0.1.0"
description = "Generic procure-to-pay sync engine for procurement, ERP and maintenance systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sidney Buenaventura" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "requests>=2.32",
    "tzdata; sys_platform == 'win32'",  # Windows ships without the IANA time zone database
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_sync"]

# --- ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "S",        # bandit (security)
    "LOG",      # logging misuse
    "G",        # logging format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["p2p_sync"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["p2p_sync"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
